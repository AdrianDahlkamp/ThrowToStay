<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ThrowToStay</title>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="landing">
    <div class="card">
      <div class="logo">ThrowToStay</div>
      <h1>Fotos für dein Event</h1>
      <p>
        Scanne den QR-Code deines Events, um direkt zur Kamera zu gelangen.<br>

        und am Folgetag ab 08:00 Uhr öffnet die gemeinsame Galerie.
      </p>
      <div class="actions">
        <a class="btn secondary" href="/admin" style="text-decoration:none">Admin-Bereich</a>
      </div>
    </div>
  </div>
