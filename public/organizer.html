<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ThrowToStay – Veranstalter</title>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/css/app.css">
  <meta name="theme-color" content="#0e1116">
</head>
<body>
  <!-- Login mit Schlüssel -->
  <div class="admin-login" id="loginBox">
    <h1><span class="logo" style="font-size:30px">ThrowToStay</span></h1>
    <p>Veranstalter-Login – gib den Zugangsschlüssel ein, den du vom Admin erhalten hast, um Events zu erstellen.</p>
    <form id="loginForm">
      <div class="field">
        <label for="keyInput">Zugangs-Schlüssel</label>
        <input id="keyInput" type="text" required placeholder="z. B. TTS-4F9K-M2QX" autocomplete="off" style="text-transform:uppercase">
      </div>
      <button class="btn" type="submit" style="width:100%">Anmelden</button>
    </form>
    <div class="error" id="loginError"></div>
    <p class="admin-note" style="margin-top:14px"><a href="/admin" style="color:var(--accent)">Admin? Hier anmelden</a></p>
  </div>

  <!-- Veranstalter-Dashboard -->
  <div class="admin-wrap" id="dashboard" style="display:none">
    <div class="admin-head">
      <div>
        <div class="logo">ThrowToStay</div>
        <div style="color:var(--text-dim);font-size:13.5px">Veranstalter-Bereich<span id="orgLabel"></span></div>
      </div>
      <div class="head-actions">
        <button class="btn small" id="newEventBtn" type="button">+ Event erstellen</button>
        <button class="btn small secondary" id="logoutBtn" type="button">Abmelden</button>
      </div>
    </div>

    <div id="eventList"></div>
  </div>

  <!-- Event-Wizard (interaktives Anlegen) -->
  <div class="wizard-overlay" id="wizard" style="display:none">
    <div class="wizard-card">
      <div class="wizard-head">
        <h2>Neues Event anlegen</h2>
        <button class="rbtn" id="wizardClose" type="button" aria-label="Schließen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="wizard-progress" id="wizardProgress"></div>
      <div class="wizard-step" id="wizardBody"></div>
      <div class="wizard-nav">
        <button class="btn small secondary" id="wizardBack" type="button">Zurück</button>
        <button class="btn small" id="wizardNext" type="button">Weiter</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="/js/organizer.js"></script>
</body>
</html>
